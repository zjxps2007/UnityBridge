[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "unity-bridge"
version = "0.3.0-rc.2"
description = "Python client for controlling the Unity Editor through a local HTTP connector."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "Unity Agent" }
]
dependencies = []

[project.optional-dependencies]
build = [
  "pyinstaller>=6.0",
]

[project.scripts]
unity-bridge = "unity_bridge._bootstrap:main"
unity_bridge = "unity_bridge._bootstrap:main"

[tool.setuptools.packages.find]
where = ["src"]
