name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload standalone bundles to. Leave blank to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

env:
  RELEASE_REF: ${{ github.event.inputs.release_tag || github.ref_name }}

jobs:
  standalone:
    name: Build standalone CLI (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: unity-bridge-windows-amd64.zip
          - os: ubuntu-24.04
            asset_name: unity-bridge-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            asset_name: unity-bridge-linux-arm64.tar.gz
          - os: macos-15-intel
            asset_name: unity-bridge-darwin-amd64.tar.gz
          - os: macos-15
            asset_name: unity-bridge-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up compiler SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.401"

      - name: Install package and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Test clients and installers
        run: python -m unittest discover -s tests

      - name: Test compiler worker
        run: dotnet run --project compiler-worker/UnityBridge.Compiler.Tests --configuration Release

      - name: Build standalone bundle
        run: python scripts/build-standalone.py --output-name "${{ matrix.asset_name }}"

      - name: Verify archived executable
        shell: python
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BUILD_REF: ${{ env.RELEASE_REF }}
          UNITY_BRIDGE_GITHUB_TOKEN: ${{ github.token }}
        run: |
          import json
          import os
          import subprocess
          import shutil
          import sys
          import tempfile
          from pathlib import Path
          from unity_bridge import __version__

          archive = Path("dist") / os.environ["ASSET_NAME"]
          unpacked = Path("build/release-smoke")
          shutil.unpack_archive(archive, unpacked)
          executable_name = "unity-bridge.exe" if os.name == "nt" else "unity-bridge"
          executable = str((unpacked / "unity-bridge" / executable_name).resolve())
          def run(*args):
              result = subprocess.run([executable, *args], capture_output=True, text=True, timeout=60)
              if result.returncode:
                  print(result.stdout)
                  print(result.stderr, file=sys.stderr)
                  result.check_returncode()
              return result.stdout
          assert "wait-ready" in run("--help")
          runtime = next((unpacked / "unity-bridge").glob("_unity_bridge_runtime_*"))
          assert (runtime / "host-manifest.json").is_file()
          worker = runtime / "compiler" / ("UnityBridge.Compiler.exe" if os.name == "nt" else "UnityBridge.Compiler")
          run("_host", "check-worker", "--worker", str(worker.resolve()))
          with tempfile.TemporaryDirectory() as instances:
              assert json.loads(run("--json", "--no-update-check", "--instances-dir", instances, "instances")) == []
              session = subprocess.run(
                  [executable, "--no-update-check", "--instances-dir", instances, "session"],
                  input='{"id":1,"args":["instances"]}\n{"id":2,"args":["instances"]}\n',
                  capture_output=True, text=True, timeout=60)
              session.check_returncode()
              replies = [json.loads(line) for line in session.stdout.splitlines()]
              assert [reply["id"] for reply in replies] == [1, 2], replies
              assert all(reply["exit_code"] == 0 and reply["result"] == [] for reply in replies), replies
          # Exercise the extracted executable's private exec transport as well
          # as source Python, using an isolated host and fixture Connector.
          subprocess.run(
              [sys.executable, "-m", "unittest", "tests.test_fast_exec"], check=True,
              env=dict(os.environ, UNITY_BRIDGE_TEST_CLI_EXE=executable), timeout=120)
          result = json.loads(run("--json", "update", "--check", "--ref", os.environ["BUILD_REF"]))
          assert result["mode"] == "standalone", result
          assert result["current_version"] == __version__, result
          assert result["latest_version"] == __version__, result
          assert result["target_connector_version"] == __version__, result
          print(f"Verified {os.environ['ASSET_NAME']}: standalone CLI and Connector manifest {__version__}")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: Publish complete release
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_REF }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified bundles
        uses: actions/download-artifact@v4
        with:
          pattern: unity-bridge-*
          path: dist
          merge-multiple: true

      - name: Verify complete asset set
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          version = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"]
          assert os.environ["RELEASE_REF"] == f"v{version}", "Release tag must match the package version"
          expected = {
              "unity-bridge-windows-amd64.zip",
              "unity-bridge-linux-amd64.tar.gz",
              "unity-bridge-linux-arm64.tar.gz",
              "unity-bridge-darwin-amd64.tar.gz",
              "unity-bridge-darwin-arm64.tar.gz",
          }
          assets = list(Path("dist").iterdir())
          assert {path.name for path in assets} == expected, assets
          assert all(path.is_file() and path.stat().st_size > 0 for path in assets)
          print("Verified all five release bundles")

      - name: Publish release assets and notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_REF }}
          prerelease: ${{ contains(env.RELEASE_REF, '-') }}
          make_latest: ${{ contains(env.RELEASE_REF, '-') && 'false' || 'legacy' }}
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: dist/*
