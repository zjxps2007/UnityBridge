name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload standalone executables to. Leave blank to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  standalone:
    name: Build standalone CLI (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: unity-bridge-windows-amd64.exe
          - os: ubuntu-24.04
            asset_name: unity-bridge-linux-amd64
          - os: ubuntu-24.04-arm
            asset_name: unity-bridge-linux-arm64
          - os: macos-15-intel
            asset_name: unity-bridge-darwin-amd64
          - os: macos-15
            asset_name: unity-bridge-darwin-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build executable
        run: python scripts/build-standalone.py --output-name "${{ matrix.asset_name }}"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          files: dist/${{ matrix.asset_name }}
