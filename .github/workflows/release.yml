name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload the Windows executable to. Leave blank to build an artifact only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows-standalone:
    name: Build Windows standalone CLI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build executable
        shell: pwsh
        run: .\scripts\build-windows.ps1 -SkipDependencyInstall

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: unity-bridge-windows-x64
          path: dist/unity-bridge-windows-x64.exe

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/') || github.event.inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          files: dist/unity-bridge-windows-x64.exe
