name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to upload standalone bundles to. Leave blank to build artifacts only."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  standalone:
    name: Build standalone CLI (${{ matrix.asset_name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            asset_name: unity-bridge-windows-amd64.zip
          - os: ubuntu-24.04
            asset_name: unity-bridge-linux-amd64.tar.gz
          - os: ubuntu-24.04-arm
            asset_name: unity-bridge-linux-arm64.tar.gz
          - os: macos-15-intel
            asset_name: unity-bridge-darwin-amd64.tar.gz
          - os: macos-15
            asset_name: unity-bridge-darwin-arm64.tar.gz

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and build dependencies
        run: python -m pip install -e ".[build]"

      - name: Test clients and installers
        run: python -m unittest discover -s tests

      - name: Build standalone bundle
        run: python scripts/build-standalone.py --output-name "${{ matrix.asset_name }}"

      - name: Verify archived executable
        shell: python
        env:
          ASSET_NAME: ${{ matrix.asset_name }}
          BUILD_REF: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
        run: |
          import json
          import os
          import subprocess
          import shutil
          import tempfile
          from pathlib import Path
          from unity_bridge import __version__

          archive = Path("dist") / os.environ["ASSET_NAME"]
          unpacked = Path("build/release-smoke")
          shutil.unpack_archive(archive, unpacked)
          executable_name = "unity-bridge.exe" if os.name == "nt" else "unity-bridge"
          executable = str((unpacked / "unity-bridge" / executable_name).resolve())
          def run(*args):
              return subprocess.run([executable, *args], check=True, capture_output=True, text=True, timeout=60).stdout
          assert "wait-ready" in run("--help")
          with tempfile.TemporaryDirectory() as instances:
              assert json.loads(run("--json", "--no-update-check", "--instances-dir", instances, "instances")) == []
          result = json.loads(run("--json", "update", "--check", "--ref", os.environ["BUILD_REF"]))
          assert result["mode"] == "standalone", result
          assert result["current_version"] == __version__, result
          assert result["target_connector_version"] == __version__, result
          print(f"Verified {os.environ['ASSET_NAME']}: standalone CLI and Connector {__version__}")

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset_name }}
          path: dist/${{ matrix.asset_name }}

  publish:
    name: Publish complete release
    needs: standalone
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag != '')
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download verified bundles
        uses: actions/download-artifact@v4
        with:
          pattern: unity-bridge-*
          path: dist
          merge-multiple: true

      - name: Verify complete asset set
        shell: python
        run: |
          from pathlib import Path
          expected = {
              "unity-bridge-windows-amd64.zip",
              "unity-bridge-linux-amd64.tar.gz",
              "unity-bridge-linux-arm64.tar.gz",
              "unity-bridge-darwin-amd64.tar.gz",
              "unity-bridge-darwin-arm64.tar.gz",
          }
          assets = list(Path("dist").iterdir())
          assert {path.name for path in assets} == expected, assets
          assert all(path.is_file() and path.stat().st_size > 0 for path in assets)
          print("Verified all five release bundles")

      - name: Publish release assets and notes
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.release_tag || github.ref_name }}
          body_path: docs/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: dist/*
